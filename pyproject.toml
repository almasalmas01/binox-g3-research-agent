[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binox-g3-research-agent"
version = "0.1.0"
description = "A constrained deep research agent prototype for the Binox take-home."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tavily-python>=0.3.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

